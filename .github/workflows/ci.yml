name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", test/integration, test/benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build and vet
        working-directory: ${{ matrix.dir }}
        run: |
          go build ./...
          go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ matrix.dir }}

  test:
    name: Unit and golden tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "oldest" is the go.mod minimum (1.23); keeps 1.24+ APIs out of the root module.
        go: [oldest, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'oldest' && '1.23' || 'stable' }}
          cache-dependency-path: "**/go.sum"
      - name: Test with coverage
        run: make test-cover
      - name: Upload coverage reports to Codecov
        if: matrix.go == 'oldest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  integration:
    name: Integration (PostgreSQL, MySQL, MariaDB, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: test/integration/go.mod
          cache-dependency-path: "**/go.sum"
      # The runner ships Docker, which testcontainers uses to start the databases.
      - name: End-to-end tests
        working-directory: test/integration
        run: go test -race ./...
